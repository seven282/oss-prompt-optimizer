name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      # Gate the invariants that keep the plugin from ever blocking the host:
      #   P1 no illegal static host imports survive into `lib/`
      #   P3 `lib/client.js` still matches its source
      #   P6 the entry point still instantiates with every `@deepseek-ai/dsh*`
      #      package sealed on both the ESM and CJS resolution paths
      #   P7 the client half only reads injected services, and its `apply()`
      #      really does register on a minimal host (the 1.8.2 `ctx.locale` bug)
      # `--offline` skips the recursive typecheck/test/build pass (the steps
      # above already ran them); P2 reports SKIP because a real dsh profile is
      # not reachable from CI.
      #
      # Invoked as `node scripts/preflight.mjs` rather than `pnpm preflight`:
      # `--offline` is also a pnpm flag, so passing it through pnpm risks pnpm
      # consuming it instead of forwarding it to the script.
      - name: Preflight
        run: node scripts/preflight.mjs --offline --skip-tests
