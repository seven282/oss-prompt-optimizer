name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        # Covers both `src`/`tests` (tsconfig.json) and the hand-written client
        # half (tsconfig.client.json) — the file behind the 1.8.2 / 1.8.3 incidents.
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      # Gate the invariants that keep the plugin from ever blocking the host:
      #   P1 no illegal static host imports survive into `lib/`
      #   P3 `lib/client.js` still matches its source
      #   P6 the entry point still instantiates with every `@deepseek-ai/dsh*`
      #      package sealed on both the ESM and CJS resolution paths
      #   P7 the client half only reads services it may read — injected, core, or
      #      a nested name asked for in full — and its `apply()` really does
      #      register on a faithful minimal host (the 1.8.2 `ctx.locale` and
      #      1.8.3 `ctx.get('remote').commands` bugs)
      # `--offline` skips the recursive typecheck/test/build pass (the steps
      # above already ran them); P2 reports SKIP because a real dsh profile is
      # not reachable from CI.
      #
      # Invoked as `node scripts/preflight.mjs` rather than `pnpm preflight`:
      # `--offline` is also a pnpm flag, so passing it through pnpm risks pnpm
      # consuming it instead of forwarding it to the script.
      - name: Preflight
        run: node scripts/preflight.mjs --offline --skip-tests

  # The only real-host step in CI: E3 installs the built plugin into a throwaway
  # profile, boots `dsh web`, and proves the entry is listed and the client
  # module is served — the one thing a fake host cannot prove. One leg per
  # release the manifest claims in `dshReleases`: a verdict is only honest if
  # something actually boots that host.
  #
  # Main pushes and manual dispatch only, never PRs: three boots per review
  # would tax the fast path the build-test job exists to keep. Skipped legs are
  # visible in the Actions UI rather than silently green.
  compat-matrix:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.2.0-rc.2', '0.2.1-rc.3', '0.2.2-rc.1']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Install dsh ${{ matrix.dsh }}
        # A prefix install, not `-g`: the runner's global tree stays untouched so
        # legs cannot see each other's host.
        run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/host" "@deepseek-ai/dsh@${{ matrix.dsh }}"
      - name: E3 acceptance
        run: >-
          node scripts/e3-acceptance.mjs
          --dsh-bin "$RUNNER_TEMP/host/node_modules/@deepseek-ai/dsh/lib/bin.js"
          --json "e3-${{ matrix.dsh }}.json"
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e3-${{ matrix.dsh }}
          path: e3-${{ matrix.dsh }}.json
          if-no-files-found: warn

  # Advisory only: a fresh upstream advisory must not red-light an unrelated,
  # correct PR (the vitest 3→4 forced upgrade started exactly this way).
  # The blocking signal for new dependencies on PRs is handled by review;
  # Dependabot (dependabot.yml) surfaces known advisories weekly.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Audit dependencies (advisory)
        run: pnpm audit --audit-level=high

  # Windows is where both real-machine incidents lived (reg.exe probing, CRLF,
  # `process.exit()` + libuv fail-fast, spawnSync EBUSY) — so the second matrix
  # leg runs the cheap, high-signal steps only; build/preflight stay on Linux.
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
